<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="940" height="260"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#557"/>
    </marker>
  </defs>
  <rect x="20" y="90" width="160" height="70" rx="6" fill="#eef2f7" stroke="#557" stroke-width="1.5"/>
  <text x="100" y="120" font-size="16" text-anchor="middle" fill="#223">you ask</text>
  <text x="100" y="140" font-size="13" text-anchor="middle" fill="#667">in natural language</text>
  <line x1="182" y1="125" x2="238" y2="125" stroke="#557" stroke-width="1.8" marker-end="url(#ar2)"/>
  <rect x="242" y="90" width="170" height="70" rx="6" fill="#f4f6f8" stroke="#557" stroke-width="1.5"/>
  <text x="327" y="114" font-size="16" text-anchor="middle" fill="#223">read</text>
  <text x="327" y="134" font-size="13" text-anchor="middle" fill="#667">files, logs,</text>
  <text x="327" y="150" font-size="13" text-anchor="middle" fill="#667">command output</text>
  <line x1="414" y1="125" x2="470" y2="125" stroke="#557" stroke-width="1.8" marker-end="url(#ar2)"/>
  <rect x="474" y="90" width="170" height="70" rx="6" fill="#fdf6e8" stroke="#a72" stroke-width="1.8"/>
  <text x="559" y="114" font-size="16" text-anchor="middle" fill="#223">act</text>
  <text x="559" y="134" font-size="13" text-anchor="middle" fill="#667">edit a file,</text>
  <text x="559" y="150" font-size="13" text-anchor="middle" fill="#667">run a command</text>
  <line x1="646" y1="125" x2="702" y2="125" stroke="#557" stroke-width="1.8" marker-end="url(#ar2)"/>
  <rect x="706" y="90" width="170" height="70" rx="6" fill="#eef7ef" stroke="#375" stroke-width="1.5"/>
  <text x="791" y="120" font-size="16" text-anchor="middle" fill="#223">observe</text>
  <text x="791" y="140" font-size="13" text-anchor="middle" fill="#667">did it work?</text>
  <path d="M791,164 C791,220 400,240 327,196" stroke="#557" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#ar2)"/>
  <text x="559" y="232" font-size="14" text-anchor="middle" fill="#557">repeat until done, or until it gets stuck</text>
  <text x="559" y="72" font-size="13" text-anchor="middle" fill="#a72">← you gate this step</text>
</svg>
