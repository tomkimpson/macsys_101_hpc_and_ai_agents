<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#557"/>
    </marker>
  </defs>
  <g transform="translate(0,-56)">

  <!-- you ask -->
  <rect x="18" y="110" width="176" height="96" rx="7" fill="#eef2f7" stroke="#557" stroke-width="2"/>
  <text x="106" y="152" font-size="23" text-anchor="middle" fill="#223">you ask</text>
  <text x="106" y="180" font-size="17" text-anchor="middle" fill="#667">in natural language</text>

  <line x1="197" y1="158" x2="252" y2="158" stroke="#557" stroke-width="2.2" marker-end="url(#ar2)"/>

  <!-- read -->
  <rect x="256" y="110" width="196" height="96" rx="7" fill="#f4f6f8" stroke="#557" stroke-width="2"/>
  <text x="354" y="144" font-size="23" text-anchor="middle" fill="#223">read</text>
  <text x="354" y="171" font-size="17" text-anchor="middle" fill="#667">files, logs,</text>
  <text x="354" y="192" font-size="17" text-anchor="middle" fill="#667">command output</text>

  <line x1="455" y1="158" x2="510" y2="158" stroke="#557" stroke-width="2.2" marker-end="url(#ar2)"/>

  <!-- act -->
  <rect x="514" y="110" width="196" height="96" rx="7" fill="#fdf6e8" stroke="#a72" stroke-width="2.4"/>
  <text x="612" y="144" font-size="23" text-anchor="middle" fill="#223">act</text>
  <text x="612" y="171" font-size="17" text-anchor="middle" fill="#667">edit a file,</text>
  <text x="612" y="192" font-size="17" text-anchor="middle" fill="#667">run a command</text>
  <text x="612" y="90" font-size="18" text-anchor="middle" fill="#a72">← you gate this step</text>

  <line x1="713" y1="158" x2="768" y2="158" stroke="#557" stroke-width="2.2" marker-end="url(#ar2)"/>

  <!-- observe -->
  <rect x="772" y="110" width="196" height="96" rx="7" fill="#eef7ef" stroke="#375" stroke-width="2"/>
  <text x="870" y="152" font-size="23" text-anchor="middle" fill="#223">observe</text>
  <text x="870" y="180" font-size="17" text-anchor="middle" fill="#667">did it work?</text>

  <!-- the loop -->
  <path d="M870,210 C870,300 470,318 358,214" stroke="#557" stroke-width="2.2" fill="none"
        stroke-dasharray="6 5" marker-end="url(#ar2)"/>
  <text x="600" y="352" font-size="19" text-anchor="middle" fill="#557">repeat until done, or until it gets stuck</text>
</g>
</svg>
