  <line x1="137" y1="161" x2="192" y2="161" stroke="#555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="164" y="152" font-size="13" text-anchor="middle" fill="#555">ssh</text>
  <rect x="196" y="130" width="160" height="62" rx="6" fill="#fdf0ef" stroke="#b23" stroke-width="1.8"/>
