  <text x="507" y="187" font-size="13" text-anchor="middle" fill="#667">when + where</text>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#ar)" fill="none">
    <path d="M594,150 C630,150 630,68 656,68"/>
    <path d="M594,157 C630,157 630,120 656,120"/>
    <path d="M594,168 C630,168 630,172 656,172"/>
    <path d="M594,175 C630,175 630,224 656,224"/>
