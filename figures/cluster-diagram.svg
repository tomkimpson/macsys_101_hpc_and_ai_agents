  <line x1="358" y1="161" x2="418" y2="161" stroke="#555" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="388" y="152" font-size="13" text-anchor="middle" fill="#555">sbatch</text>
  <rect x="422" y="118" width="170" height="86" rx="6" fill="#eef7ef" stroke="#375" stroke-width="1.8"/>
