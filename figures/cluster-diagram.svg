<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="10"
            refX="10.5" refY="5" orient="auto">
      <path d="M0,0.5 L0,9.5 L13,5 z" fill="#555"/>
    </marker>
  </defs>
  <g transform="translate(0,-24)">

  <!-- your laptop -->
  <rect x="8" y="120" width="152" height="80" rx="7" fill="#eef2f7" stroke="#557" stroke-width="2"/>
  <text x="84" y="154" font-size="22" text-anchor="middle" fill="#223">your laptop</text>
  <text x="84" y="180" font-size="16" text-anchor="middle" fill="#667">1 core, your data</text>

  <line x1="163" y1="160" x2="212" y2="160" stroke="#555" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="187" y="147" font-size="16" text-anchor="middle" fill="#555">ssh</text>

  <!-- login node -->
  <rect x="218" y="120" width="198" height="80" rx="7" fill="#fdf0ef" stroke="#b23" stroke-width="2.2"/>
  <text x="317" y="154" font-size="22" text-anchor="middle" fill="#223">login node</text>
  <text x="317" y="180" font-size="16" text-anchor="middle" fill="#b23">shared with everyone</text>
  <text x="317" y="228" font-size="17" text-anchor="middle" fill="#b23">edit + submit only</text>

  <line x1="419" y1="160" x2="472" y2="160" stroke="#555" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="445" y="147" font-size="16" text-anchor="middle" fill="#555">sbatch</text>

  <!-- slurm -->
  <rect x="478" y="108" width="190" height="104" rx="7" fill="#eef7ef" stroke="#375" stroke-width="2.2"/>
  <text x="573" y="145" font-size="22" text-anchor="middle" fill="#223">Slurm</text>
  <text x="573" y="172" font-size="16" text-anchor="middle" fill="#667">the queue decides</text>
  <text x="573" y="193" font-size="16" text-anchor="middle" fill="#667">when + where</text>

  <!-- fan out to the nodes -->
  <g stroke="#555" stroke-width="1.8" marker-end="url(#ar)" fill="none">
    <path d="M670,142 C688,142 688,70 698,70 L716,70"/>
    <path d="M670,152 C688,152 688,128 698,128 L716,128"/>
    <path d="M670,168 C688,168 688,186 698,186 L716,186"/>
    <path d="M670,178 C688,178 688,244 698,244 L716,244"/>
  </g>

  <!-- compute nodes -->
  <g>
    <rect x="722" y="44" width="165" height="52" rx="6" fill="#f4f6f8" stroke="#557" stroke-width="1.5"/>
    <text x="805" y="76" font-size="19" text-anchor="middle" fill="#223">compute node</text>
    <rect x="722" y="102" width="165" height="52" rx="6" fill="#f4f6f8" stroke="#557" stroke-width="1.5"/>
    <text x="805" y="134" font-size="19" text-anchor="middle" fill="#223">compute node</text>
    <rect x="722" y="160" width="165" height="52" rx="6" fill="#f4f6f8" stroke="#557" stroke-width="1.5"/>
    <text x="805" y="192" font-size="19" text-anchor="middle" fill="#223">compute node</text>
    <rect x="722" y="218" width="165" height="52" rx="6" fill="#f4f6f8" stroke="#557" stroke-width="1.5"/>
    <text x="805" y="250" font-size="19" text-anchor="middle" fill="#223">compute node</text>
  </g>
  <text x="895" y="164" font-size="18" fill="#667">× thousands</text>

  <!-- shared filesystem -->
  <rect x="218" y="348" width="669" height="66" rx="7" fill="#f7f4ee" stroke="#875" stroke-width="2"/>
  <text x="553" y="378" font-size="21" text-anchor="middle" fill="#223">shared filesystem</text>
  <text x="553" y="401" font-size="16" text-anchor="middle" fill="#667">$HOME (small, backed up) · /data/gpfs/projects (big, not backed up)</text>

  <g stroke="#875" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="231" y1="203" x2="231" y2="348"/>
    <line x1="805" y1="272" x2="805" y2="348"/>
  </g>
</g>
</svg>
